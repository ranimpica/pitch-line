<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pitch Line">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pitch Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap">
<style>
/* One screen, tuner style: note scale on the left, song line (yellow) + your line (blue) scrolling past a centre line; Add media on top, Play/Pause at the bottom. */
:root{ --bg:#0d0f14; --panel:#151922; --line:#262c3a; --fg:#f2f3f7; --muted:#8a92a6; --song:#f5c443; --you:#4fd8e8; --ok:#5ee08a; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:600 15px/1.4 Manrope,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,label:focus-within{outline:2px solid var(--you);outline-offset:3px}
.app{height:100%;display:flex;flex-direction:column;gap:12px;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:10px}
.add{position:relative;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:800;flex:none}
.add input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.name{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.stage{flex:1;position:relative;border-radius:18px;background:var(--panel);border:1px solid var(--line);overflow:hidden;min-height:200px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;background:rgba(21,25,34,.86)}
.msg b{font:800 20px Manrope,sans-serif}
.msg span{color:var(--muted);max-width:30ch}
.bar{width:min(240px,70%);height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--song)}
.bottom{display:flex;align-items:center;gap:14px}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:38px;text-align:center}
.seek{flex:1;accent-color:var(--song);min-width:0}
.pp{width:68px;height:68px;border-radius:50%;background:var(--song);color:#1b1505;display:grid;place-items:center;flex:none}
.pp svg{width:28px;height:28px;fill:currentColor}
.pp:disabled{opacity:.35;cursor:default}
.chip{flex:none;padding:8px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap}
.speed{flex:none;min-width:56px;padding:10px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.result small{color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.pct{font:800 76px/1 Manrope,sans-serif;color:var(--song);font-variant-numeric:tabular-nums}
.best{font-weight:800;color:var(--fg)}
.best.new{color:var(--ok)}
.again{margin-top:6px;padding:14px 26px;border-radius:999px;background:var(--song);color:#1b1505;font-weight:800}
.live{flex:none;padding:8px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <label class="add">＋ Add media<input type="file" id="file" accept="audio/*,video/*"></label>
    <div class="name" id="name">No song yet</div>
    <button class="chip" id="mic" hidden aria-label="Switch microphone">🎤 Mic</button>
    <div class="live" id="live" hidden>0%</div>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="msg" id="empty"><b>Add a song or video</b><span>MP3 or MP4. Then press play and sing so the blue line follows the yellow one. Best with headphones.</span></div>
    <div class="msg result" id="result" hidden><small>Match with the song</small><div class="pct" id="pct">0%</div><span class="best" id="bestT"></span><button class="again" id="again">Sing again</button></div>
    <div class="msg" id="busy" hidden><b id="busyT">Reading the song…</b><div class="bar"><i id="busyB"></i></div></div>
  </div>

  <div class="bottom">
    <span class="time" id="tNow">0:00</span>
    <input class="seek" type="range" id="seek" min="0" max="1" step="0.01" value="0" aria-label="Position in song">
    <span class="time" id="tEnd">0:00</span>
    <button class="speed" id="speed" aria-label="Playback speed">1×</button>
    <button class="pp" id="pp" aria-label="Play" disabled><svg viewBox="0 0 24 24" id="ppIcon"><path d="M7 4.5v15l13-7.5z"/></svg></button>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const pc = m => ((Math.round(m)%12)+12)%12;
const noteName = m => NAMES[pc(m)] + (Math.floor(Math.round(m)/12)-1);
const fmt = s => { s = Math.max(0, s|0); return (s/60|0) + ':' + String(s%60).padStart(2,'0'); };
const V = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const C = { bg:V('--panel'), fg:V('--fg'), muted:V('--muted'), song:V('--song'), you:V('--you'), ok:V('--ok') };
const PLAY = '<path d="M7 4.5v15l13-7.5z"/>', PAUSE = '<path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/>';

let ctx = null, buf = null, playing = false, offsetAt = 0, rate = 1, mediaUrl = null;
// playback through the browser's own player: it can slow down while keeping the pitch
const audio = new Audio(); audio.preload = 'auto'; audio.preservesPitch = true; audio.webkitPreservesPitch = true; audio.mozPreservesPitch = true; audio.volume = 0.85;
let frames = new Float32Array(0), hop = 0.02, dur = 0, lo = 48, hi = 72;
let trail = [], micOn = false, analyser = null, micBuf = null, hist = [], you = null, lastSong = null;
const LAT = 0.1; // mic delay compensation

function ensureCtx(){ if (ctx) return; ctx = new (window.AudioContext||window.webkitAudioContext)(); }
const now = () => audio.currentTime || 0;
function wavBlob(b){ // used only when the sound had to be pulled out of a video
  const ch = Math.min(2, b.numberOfChannels), n = b.length, sr = b.sampleRate, data = new DataView(new ArrayBuffer(44 + n*ch*2));
  const w = (o, str) => { for (let i = 0; i < str.length; i++) data.setUint8(o+i, str.charCodeAt(i)); };
  w(0,'RIFF'); data.setUint32(4, 36 + n*ch*2, true); w(8,'WAVE'); w(12,'fmt '); data.setUint32(16,16,true); data.setUint16(20,1,true);
  data.setUint16(22,ch,true); data.setUint32(24,sr,true); data.setUint32(28,sr*ch*2,true); data.setUint16(32,ch*2,true); data.setUint16(34,16,true);
  w(36,'data'); data.setUint32(40, n*ch*2, true);
  const cs = []; for (let c = 0; c < ch; c++) cs.push(b.getChannelData(c));
  let o = 44; for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++){ const v = Math.max(-1, Math.min(1, cs[c][i])); data.setInt16(o, v < 0 ? v*0x8000 : v*0x7fff, true); o += 2; }
  return new Blob([data], { type: 'audio/wav' });
}

// ---------- YIN ----------
function yin(x, off, W, tmin, tmax, thr, d){
  let run = 0; d[0] = 1;
  for (let tau = 1; tau <= tmax; tau++){ let s = 0; for (let j = 0; j < W; j++){ const v = x[off+j]-x[off+j+tau]; s += v*v; } run += s; d[tau] = run > 0 ? s*tau/run : 1; }
  let tau = tmin; for (; tau <= tmax; tau++){ if (d[tau] < thr){ while (tau+1 <= tmax && d[tau+1] < d[tau]) tau++; break; } }
  if (tau > tmax) return null;
  let b = tau; if (tau > 1 && tau < tmax){ const a = d[tau-1], c = d[tau+1], m = d[tau], den = a+c-2*m; if (den) b = tau + (a-c)/(2*den); }
  return b;
}
function yinLow(x, off, W, tmin, tmax, d){
  let run = 0; d[0] = 1;
  for (let tau = 1; tau <= tmax; tau++){ let s = 0; for (let j = 0; j < W; j += 2){ const v = x[off+j]-x[off+j+tau]; s += v*v; } run += s; d[tau] = run > 0 ? s*tau/run : 1; }
  let tau = tmin;
  for (; tau <= tmax; tau++){ if (d[tau] < 0.2){ while (tau+1 <= tmax && d[tau+1] < d[tau]) tau++; break; } }
  if (tau > tmax){ let bi = -1, bv = 0.38; for (let k = tmin; k <= tmax; k++) if (d[k] < bv){ bv = d[k]; bi = k; } if (bi < 0) return null; tau = bi; }
  let b = tau; if (tau > 1 && tau < tmax){ const a = d[tau-1], c = d[tau+1], m = d[tau], den = a+c-2*m; if (den) b = tau + (a-c)/(2*den); }
  return b;
}
const toMidi = f => 69 + 12*Math.log2(f/440);
const median = a => { const s = a.slice().sort((p,q)=>p-q); return s[s.length>>1]; };

// ---------- song line extraction ----------
async function analyze(buffer){
  const SR = 16000, off = new OfflineAudioContext(1, Math.max(1, Math.ceil(buffer.duration*SR)), SR);
  const s = off.createBufferSource(); s.buffer = buffer;
  const hp = off.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 85;
  const lp = off.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100;
  s.connect(hp); hp.connect(lp); lp.connect(off.destination); s.start();
  const x = (await off.startRendering()).getChannelData(0);
  const W = 512, HOP = 320, tmin = Math.floor(SR/1000), tmax = Math.ceil(SR/62);
  const n = Math.max(0, Math.floor((x.length - W - tmax - 1)/HOP));
  const rms = new Float32Array(n), raw = new Float32Array(n).fill(NaN), d = new Float32Array(tmax+2);
  for (let i = 0; i < n; i++){ let e = 0, o = i*HOP; for (let j = 0; j < W; j++) e += x[o+j]*x[o+j]; rms[i] = Math.sqrt(e/W); }
  const srt = Array.from(rms).sort((a,b)=>a-b), gate = 0.15*(srt[Math.floor(srt.length*.95)]||0);
  for (let i = 0; i < n; i++){
    if (rms[i] > gate){ const t = yin(x, i*HOP, W, tmin, tmax, 0.18, d); if (t){ const m = toMidi(SR/t); if (m > 36 && m < 86) raw[i] = m; } }
    if (i % 400 === 0){ busy('Reading the song…', 0.1 + 0.9*i/n); await new Promise(r => setTimeout(r)); }
  }
  // smooth, fix octave jumps, drop tiny blips (< 100 ms)
  const sm = new Float32Array(n).fill(NaN);
  for (let i = 0; i < n; i++){ if (raw[i] !== raw[i]) continue; const w = []; for (let k = -2; k <= 2; k++){ const v = raw[i+k]; if (v !== undefined && v === v) w.push(v); } if (w.length >= 3) sm[i] = median(w); }
  for (let i = 1; i < n; i++){ const p = sm[i-1], v = sm[i]; if (p === p && v === v){ if (v-p > 9) sm[i] -= 12; else if (p-v > 9) sm[i] += 12; } }
  // steady the line: split into held notes and flatten each one to its middle pitch
  const out = new Float32Array(n).fill(NaN), minLen = Math.round(0.12*SR/HOP);
  let st = -1, vals = [];
  const close = end => { if (st >= 0 && end - st >= minLen){ const m = median(vals); for (let k = st; k < end; k++) out[k] = m; } st = -1; vals = []; };
  for (let i = 0; i < n; i++){
    const v = sm[i];
    if (v !== v){ // bridge 1–2 frame dropouts inside a note
      if (st >= 0 && i+2 < n && (sm[i+1] === sm[i+1] || sm[i+2] === sm[i+2])) continue;
      close(i); continue;
    }
    if (st < 0){ st = i; vals = [v]; continue; }
    if (Math.abs(v - median(vals)) <= 0.8) vals.push(v); else { close(i); st = i; vals = [v]; }
  }
  close(n);
  // join notes that are close together with a short slide
  for (let i = 1; i < n; i++){
    if (out[i] === out[i] || out[i-1] !== out[i-1]) continue;
    let j = i; while (j < n && out[j] !== out[j]) j++;
    if (j < n && j - i <= 4){ const a = out[i-1], b = out[j]; for (let k = i; k < j; k++) out[k] = a + (b-a)*(k-i+1)/(j-i+1); }
    i = j;
  }
  return { f: out, hop: HOP/SR };
}
function setRange(){
  const v = Array.from(frames).filter(x => x === x).sort((a,b)=>a-b);
  if (!v.length){ lo = 48; hi = 72; return; }
  let a = v[Math.floor(v.length*.03)] - 5, b = v[Math.floor(v.length*.97)] + 5;
  if (b - a < 22){ const c = (a+b)/2; a = c - 11; b = c + 11; }
  lo = Math.floor(a); hi = Math.ceil(b);
}

// ---------- loading ----------
function busy(t, p){ $('busy').hidden = false; $('busyT').textContent = t; $('busyB').style.width = Math.round(p*100)+'%'; }
function extractViaPlayer(file){
  return new Promise((resolve, reject) => {
    const RATE = 2, url = URL.createObjectURL(file), v = document.createElement('video');
    v.preload = 'auto'; v.src = url; v.playsInline = true; v.preservesPitch = false; v.mozPreservesPitch = false; v.webkitPreservesPitch = false;
    const L = [], R = []; let node, sp, done = false;
    const finish = err => {
      if (done) return; done = true; try{ v.pause(); sp.disconnect(); node.disconnect(); }catch(e){} URL.revokeObjectURL(url);
      if (err) return reject(err);
      const n = L.reduce((a,c)=>a+c.length,0); if (!n) return reject(new Error('no audio'));
      const out = new AudioBuffer({ length:n, sampleRate:ctx.sampleRate/RATE, numberOfChannels:2 }), A = out.getChannelData(0), B = out.getChannelData(1); let o = 0;
      for (let k = 0; k < L.length; k++){ A.set(L[k], o); B.set(R[k], o); o += L[k].length; } resolve(out);
    };
    v.onerror = () => finish(new Error('unreadable'));
    let lastLen = -1; const watch = setInterval(() => { if (done){ clearInterval(watch); return; } if (L.length === lastLen){ clearInterval(watch); finish(L.length ? undefined : new Error('stalled')); } lastLen = L.length; }, 6000);
    v.onloadedmetadata = async () => {
      try{
        node = ctx.createMediaElementSource(v); sp = ctx.createScriptProcessor(4096, 2, 2);
        const sink = ctx.createGain(); sink.gain.value = 0; node.connect(sp); sp.connect(sink); sink.connect(ctx.destination);
        sp.onaudioprocess = e => { if (v.paused || v.ended) return; const ib = e.inputBuffer; L.push(new Float32Array(ib.getChannelData(0))); R.push(new Float32Array(ib.getChannelData(ib.numberOfChannels > 1 ? 1 : 0))); if (isFinite(v.duration)) busy('Taking the sound from the video…', 0.1*v.currentTime/v.duration); };
        v.onended = () => finish(); await ctx.resume(); v.playbackRate = RATE; await v.play();
      }catch(e){ finish(e); }
    };
  });
}
// ---- read the sound track straight out of MP4 / MOV videos (works on iPhone, no playback needed) ----
let mp4boxReady = null;
function loadMp4box(){
  if (window.MP4Box) return Promise.resolve(window.MP4Box);
  if (!mp4boxReady) mp4boxReady = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js';
    sc.onload = () => res(window.MP4Box); sc.onerror = () => { mp4boxReady = null; rej(new Error('mp4box')); }; document.head.appendChild(sc);
  });
  return mp4boxReady;
}
// same function that goes into the page
function extractAAC(MP4Box, arrayBuffer){
  return new Promise((resolve, reject) => {
    const f = MP4Box.createFile(); const chunks = []; let total = 0, track = null, asc = null, expected = 0;
    f.onError = e => reject(new Error('mp4: ' + e));
    f.onReady = info => {
      track = info.audioTracks && info.audioTracks[0];
      if (!track) return reject(new Error('no audio track'));
      if (!/^mp4a/.test(track.codec)) return reject(new Error('not AAC: ' + track.codec));
      try{
        const entry = f.getTrackById(track.id).mdia.minf.stbl.stsd.entries[0];
        const d = entry.esds.esd.findDescriptor(4).findDescriptor(5); asc = d.data;
      }catch(e){ asc = null; }
      expected = track.nb_samples;
      f.setExtractionOptions(track.id, null, { nbSamples: 1000 });
      f.start();
    };
    f.onSamples = (id, u, samples) => {
      for (const s of samples){ chunks.push(s.data); total += s.data.length; }
      if (chunks.length >= expected) done();
    };
    const RATES = [96000,88200,64000,48000,44100,32000,24000,22050,16000,12000,11025,8000,7350];
    const done = () => {
      let obj = 2, sfi = RATES.indexOf(track.audio.sample_rate), ch = track.audio.channel_count;
      if (asc && asc.length >= 2){
        const o = asc[0] >> 3, s = ((asc[0] & 7) << 1) | (asc[1] >> 7), c = (asc[1] >> 3) & 15;
        if (o >= 1 && o <= 4) obj = o;          // HE-AAC (5/29) is written as LC; decoders find the SBR part themselves
        if (s < 13) sfi = s; if (c > 0 && c < 8) ch = c;
      }
      if (sfi < 0) sfi = 4;
      const out = new Uint8Array(total + 7*chunks.length); let o = 0;
      for (const d of chunks){
        const len = d.length + 7;
        out[o] = 0xFF; out[o+1] = 0xF1;
        out[o+2] = ((obj-1) << 6) | (sfi << 2) | (ch >> 2);
        out[o+3] = ((ch & 3) << 6) | (len >> 11);
        out[o+4] = (len >> 3) & 0xFF;
        out[o+5] = ((len & 7) << 5) | 0x1F;
        out[o+6] = 0xFC;
        out.set(d, o+7); o += len;
      }
      resolve(out);
    };
    arrayBuffer.fileStart = 0;
    f.appendBuffer(arrayBuffer); f.flush();
    setTimeout(() => { if (track && chunks.length) done(); else reject(new Error('timeout')); }, 4000);
  });
}

async function load(file){
  if (!file) return;
  ensureCtx(); ctx.resume(); stop(); offsetAt = 0; audio.removeAttribute('src');
  const isVideo = /^video\//.test(file.type) || /\.(mp4|mov|mkv|webm|avi|m4v|3gp)$/i.test(file.name);
  $('empty').hidden = true; busy(isVideo ? 'Taking the sound from the video…' : 'Opening the song…', 0.03);
  let b = null, playable = file;
  const data = await file.arrayBuffer();
  if (isVideo){ // 1) fast path: pull the AAC sound track out of the video file
    try{
      setTimeout(() => busy('Taking the sound from the video…', 0.06));
      const aac = await extractAAC(await loadMp4box(), data.slice(0));
      b = await ctx.decodeAudioData(aac.buffer.slice(0));
      playable = new Blob([aac], { type: 'audio/aac' });
    }catch(e){ b = null; playable = file; }
  }
  if (!b){ try{ b = await ctx.decodeAudioData(data.slice(0)); }catch(e){} }           // 2) let the browser decode it
  if (!b && isVideo){ try{ b = await extractViaPlayer(file); playable = wavBlob(b); }catch(e){} } // 3) last resort
  if (!b){ $('busy').hidden = true; $('empty').hidden = false; $('empty').querySelector('b').textContent = "That file couldn't be opened"; $('empty').querySelector('span').textContent = "Couldn't read the sound in this file. Try another MP4 or an MP3."; return; }
  if (mediaUrl) URL.revokeObjectURL(mediaUrl); mediaUrl = URL.createObjectURL(playable); audio.src = mediaUrl; audio.load();
  buf = b; songSR = b.sampleRate; songMono = new Float32Array(b.length); for (let c = 0; c < b.numberOfChannels; c++){ const d = b.getChannelData(c); for (let i = 0; i < d.length; i++) songMono[i] += d[i]/b.numberOfChannels; } sbReset(); sbResetLag(); const r = await analyze(b); frames = r.f; hop = r.hop; dur = b.duration; setRange();
  trail = []; $('busy').hidden = true;
  songName = file.name.replace(/\.[^.]+$/, ''); songKey = 'pitchline-best:' + songName + '|' + Math.round(dur);
  resetScore(); $('result').hidden = true; showName();
  $('seek').max = dur; $('seek').value = 0; $('tEnd').textContent = fmt(dur); $('pp').disabled = false;
}

// ---------- transport + mic ----------
let micStream = null, micSource = null, micList = [], micIdx = -1;
const isBuiltIn = d => /iphone|built-?in|internal|phone microphone|default/i.test(d.label) && !/airpod|bluetooth|headset|earpod|hands-?free|buds|wireless/i.test(d.label);
async function openMic(deviceId){
  const st = await navigator.mediaDevices.getUserMedia({ audio: Object.assign({ echoCancellation: true, noiseSuppression: false, autoGainControl: false }, deviceId ? { deviceId: { exact: deviceId } } : {}) });
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (micSource) micSource.disconnect();
  micStream = st;
  if (!analyser){
    analyser = ctx.createAnalyser(); analyser.fftSize = 4096;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 55;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1600;
    hp.connect(lp); lp.connect(analyser); analyser._in = hp;
    micBuf = new Float32Array(4096); sbInit(ctx.sampleRate);
  }
  micSource = ctx.createMediaStreamSource(st); micSource.connect(analyser._in);
  micOn = true; hist = []; smooth = null;
  const track = st.getAudioTracks()[0]; const lbl = (track && track.label) || 'Microphone';
  $('mic').textContent = '🎤 ' + shortMic(lbl); $('mic').hidden = false;
}
const shortMic = l => /iphone|built-?in|internal/i.test(l) ? 'Phone mic' : /airpod/i.test(l) ? 'AirPods mic' : /earpod|headset|wired/i.test(l) ? 'Earbuds mic' : l.length > 16 ? l.slice(0, 15) + '…' : l;
async function startMic(){
  if (micOn) return;
  try{
    await openMic(null);
    micList = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput' && d.deviceId);
    const cur = micStream.getAudioTracks()[0].getSettings().deviceId;
    const builtIn = micList.find(isBuiltIn);
    if (builtIn && builtIn.deviceId !== cur){ try{ await openMic(builtIn.deviceId); }catch(e){} } // earbuds in: still listen with the phone's mic
    const now_ = micStream.getAudioTracks()[0].getSettings().deviceId;
    micIdx = micList.findIndex(d => d.deviceId === now_);

}
async function nextMic(){
  if (!micOn){ ensureCtx(); await ctx.resume(); return startMic(); }
  micList = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput' && d.deviceId);
  if (micList.length < 2){ $('mic').textContent = '🎤 Only one mic'; setTimeout(() => { const t = micStream && micStream.getAudioTracks()[0]; $('mic').textContent = '🎤 ' + shortMic((t && t.label) || 'Microphone'); }, 1500); return; }

}
async function play(){
  if (!buf) return; ensureCtx(); await ctx.resume(); await startMic();

  audio.playbackRate = rate;
  try{ await audio.play(); }catch(e){ return; }

}
audio.addEventListener('ended', () => { playing = false; setIcon(); finish(); });
function stop(){ audio.pause(); playing = false; setIcon(); }
function setIcon(){ $('ppIcon').innerHTML = PLAY; $('pp').setAttribute('aria-label','Play'); }
const micD = new Float32Array(1200);
// ===== Song-removal for the mic (known-reference spectral subtraction) =====
const DN = 4096;
const HANN = new Float32Array(DN); for (let i = 0; i < DN; i++) HANN[i] = 0.5 - 0.5*Math.cos(2*Math.PI*i/(DN-1));
function fft(re, im, inv){

const SB = { // state
  mr: new Float32Array(DN), mi: new Float32Array(DN), sr_: new Float32Array(DN), si: new Float32Array(DN),
  M: new Float32Array(DN/2), S: new Float32Array(DN/2), Sprev: new Float32Array(DN/2), Sm: new Float32Array(DN/2),
  out: new Float32Array(DN), bands: null, hist: null, H: null, hp: 0, frame: 0,
  lag: 0.12, lagHist: [], cleanRatio: 1

function sbInit(ctxSR){
  // ~1/3-octave bands 60 Hz .. 1.6 kHz
  const edges = []; for (let f = 60; f < 1700; f *= 1.26) edges.push(Math.round(f*DN/ctxSR));
  SB.bands = []; for (let i = 0; i < edges.length-1; i++) SB.bands.push([Math.max(1, edges[i]), Math.max(edges[i]+1, edges[i+1])]);
  SB.hist = SB.bands.map(() => new Float32Array(600).fill(NaN)); SB.H = new Float32Array(SB.bands.length); SB.hp = 0; SB.frame = 0;
  SB.lagHist = []; SB.lag = 0.12;
}
function sbReset(){ if (SB.hist){ SB.hist.forEach(h => h.fill(NaN)); SB.H.fill(0); SB.Sprev.fill(0); SB.lagHist = []; } }
// mic: newest DN samples (Float32Array, ctx rate); song: mono Float32Array at songSR; tSong: song time playing now; rate: speed
// returns cleaned time signal (Hann-windowed) in SB.out, and SB.cleanRatio (energy kept)
function sbClean(mic, ctxSR, song, songSR, tSong, rate){
  const {mr, mi, sr_, si, M, S, Sprev, Sm, bands, hist, H} = SB;
  for (let i = 0; i < DN; i++){ mr[i] = mic[i]*HANN[i]; mi[i] = 0; }
  fft(mr, mi, false);
  for (let k = 0; k < DN/2; k++) M[k] = Math.hypot(mr[k], mi[k]);
  // song window the mic is hearing now (centre of mic window = now - DN/2 real samples, minus speaker->mic lag)
  const centre = tSong - (SB.lag + DN/2/ctxSR)*rate;
  const c0 = Math.round(centre*songSR) - DN/2;
  for (let i = 0; i < DN; i++){ const j = c0 + i; sr_[i] = (j >= 0 && j < song.length ? song[j] : 0)*HANN[i]; si[i] = 0; }
  fft(sr_, si, false);
  const fr = songSR/ctxSR; // mic bin k <-> song bin k/fr
  for (let k = 0; k < DN/2; k++){ const j = Math.round(k/fr); S[k] = j < DN/2 ? Math.hypot(sr_[j], si[j]) : 0; }
  // smear: max over +-2 bins and previous frame (covers timing / tuning slop)
  for (let k = 0; k < DN/2; k++){ let m = Sprev[k]; for (let d = -2; d <= 2; d++){ const v = S[k+d]; if (v > m) m = v; } Sm[k] = m; }
  Sprev.set(S);
  // learn the speaker->mic level per band: 20th percentile of mic/song over the last ~10 s
  // (breaths and pauses give song-only moments, so this lands on the speaker level, not your voice)
  let songE = 0, maxSe = 0; const se_ = [];
  for (let b = 0; b < bands.length; b++){ let se = 0; for (let k = bands[b][0]; k < bands[b][1]; k++) se += S[k]*S[k]; se_.push(se); songE += se; if (se > maxSe) maxSe = se; }
  for (let b = 0; b < bands.length; b++){
    if (se_[b] < maxSe*0.01 || se_[b] < 1e-4){ hist[b][SB.hp] = NaN; continue; }
    let me = 0; for (let k = bands[b][0]; k < bands[b][1]; k++) me += M[k]*M[k];

  }
  SB.hp = (SB.hp + 1) % hist[0].length;
  if (SB.frame++ % 15 === 0){
    for (let b = 0; b < bands.length; b++){
      const v = Array.from(hist[b]).filter(x => x === x).sort((p,q) => p-q);

  let eIn = 0, eOut = 0;

      eIn += m*m; eOut += r*r;

    }
  }
  for (let k = 0; k < bands[0][0]; k++){ mr[k] = mi[k] = 0; if (k > 0){ mr[DN-k] = mi[DN-k] = 0; } }

}
// speaker->mic delay: every half second, test delays 0..400 ms and keep the one whose song spectrum best matches the mic
const LAGS = []; for (let L = 0.0; L <= 0.401; L += 0.025) LAGS.push(L);
const lagScore = new Float32Array(LAGS.length);
function sbTrackLag(mic, ctxSR, song, songSR, tSong, rate){
  if (SB.frame % 30) return;
  const {mr, mi, sr_, si, M} = SB, fr = songSR/ctxSR, k0 = SB.bands[0][0], k1 = SB.bands[SB.bands.length-1][1];
  for (let i = 0; i < DN; i++){ mr[i] = mic[i]*HANN[i]; mi[i] = 0; } fft(mr, mi, false);
  let mm = 0; for (let k = k0; k < k1; k++){ M[k] = Math.hypot(mr[k], mi[k]); mm += M[k]*M[k]; }
  if (mm < 1e-6) return;
  for (let li = 0; li < LAGS.length; li++){
    const c0 = Math.round((tSong - (LAGS[li] + DN/2/ctxSR)*rate)*songSR) - DN/2;
    for (let i = 0; i < DN; i++){ const j = c0 + i; sr_[i] = (j >= 0 && j < song.length ? song[j] : 0)*HANN[i]; si[i] = 0; }
    fft(sr_, si, false);
    let dot = 0, ss = 0;
    for (let k = k0; k < k1; k++){ const j = Math.round(k/fr); const v = Math.hypot(sr_[j], si[j]); dot += v*M[k]; ss += v*v; }
    lagScore[li] = lagScore[li]*0.9 + (ss > 0 ? dot/Math.sqrt(ss*mm) : 0);
  }
  let bi = 0; for (let li = 1; li < LAGS.length; li++) if (lagScore[li] > lagScore[bi]) bi = li;
  SB.lag = LAGS[bi];
}
function sbResetLag(){ lagScore.fill(0); }

let songMono = null, songSR = 44100;
function readMic(){
  if (!micOn) return null;
  analyser.getFloatTimeDomainData(micBuf);
  const sr = ctx.sampleRate, MW = 2048, OFF = 474;
  let x = micBuf, keep = 1;
  if (playing && songMono){ // take the song (coming from the phone speaker) out of what the mic hears
    sbTrackLag(micBuf, sr, songMono, songSR, now(), rate);
    sbClean(micBuf, sr, songMono, songSR, now(), rate);
    x = SB.out; keep = SB.cleanRatio;
  }
  let e = 0; for (let i = OFF; i < OFF + MW; i++) e += x[i]*x[i];
  const rms = Math.sqrt(e/MW);
  const t = (rms < 0.0025 || keep < 0.1) ? null : yinLow(x, OFF, MW, Math.floor(sr/1100), Math.min(Math.ceil(sr/58), 1099), micD);
  if (!t){ // hold the last pitch through short gaps (~120 ms) so the line doesn't break up
    if (++miss > 7){ hist = []; smooth = null; }
    return smooth;
  }
  miss = 0;
  hist.push(toMidi(sr/t)); if (hist.length > 7) hist.shift();
  const m = median(hist);
  if (smooth === null || Math.abs(m - smooth) > 2.5) smooth = m;   // real jump to a new note: follow at once

}
let songName = '', songKey = '', hitW = 0, tot = 0;
const pct = () => tot > 0 ? Math.round(100*hitW/tot) : 0;
function resetScore(){ hitW = 0; tot = 0; $('live').textContent = '0%'; }
function getBest(){ try{ const v = localStorage.getItem(songKey); return v === null ? null : +v; }catch(e){ return null; } }
function setBest(v){ try{ localStorage.setItem(songKey, String(v)); }catch(e){} }
function showName(){ const b = getBest(); $('name').textContent = songName + (b !== null ? ' · Best ' + b + '%' : ''); }
function finish(){
  $('live').hidden = true;
  if (tot < 30){ return; } // too little singing time to score
  const p = pct(), b = getBest(), isNew = b === null || p > b;
  $('pct').textContent = p + '%';
  $('bestT').textContent = isNew ? (b === null ? 'First score saved as your best' : 'New best! (was ' + b + '%)') : 'Your best: ' + b + '%';
  $('bestT').className = 'best' + (isNew ? ' new' : '');
  if (isNew) setBest(p);
  showName(); $('result').hidden = false;
}
let miss = 0, smooth = null, octK = null, ratios = [], floor = 0, fc = 0, env = new Float32Array(0);
const ENV_HOP = 0.02;
function buildEnv(b){ // loudness of the song every 20 ms
  const sr = b.sampleRate, step = Math.round(sr*ENV_HOP), n = Math.floor(b.length/step), out = new Float32Array(n);
  const chs = []; for (let c = 0; c < b.numberOfChannels; c++) chs.push(b.getChannelData(c));
  for (let i = 0; i < n; i++){ let e = 0; const o = i*step; for (let j = 0; j < step; j += 4){ let v = 0; for (const ch of chs) v += ch[o+j]; v /= chs.length; e += v*v; } out[i] = Math.sqrt(e/(step/4)); }
  return out;
}
function songLevel(t){ // loudest point of the last 150 ms (covers speaker + mic delay)
  const i1 = Math.floor(t/ENV_HOP), i0 = Math.max(0, i1 - 8); let m = 0;
  for (let i = i0; i <= i1 && i < env.length; i++) if (env[i] > m) m = env[i];
  return m;
}
const songAt = t => { const i = Math.round(t/hop); const v = frames[i]; return v === v && v !== undefined ? v : null; };

// ---------- drawing ----------
const cv = $('cv'), g = cv.getContext('2d'); let Wd = 0, Ht = 0;
function resize(){ const dpr = window.devicePixelRatio||1, r = cv.getBoundingClientRect(); Wd = r.width; Ht = r.height; cv.width = Math.round(Wd*dpr); cv.height = Math.round(Ht*dpr); g.setTransform(dpr,0,0,dpr,0,0); }
window.addEventListener('resize', resize); resize();
function line(pts, X, Y, color, width){
  g.strokeStyle = color; g.lineWidth = width; g.lineJoin = g.lineCap = 'round'; g.beginPath(); let pen = false, lt = -1;
  for (const p of pts){ if (p.m === null || (pen && p.t - lt > 0.12)){ pen = false; if (p.m === null) continue; } const x = X(p.t), y = Y(p.m); pen ? g.lineTo(x,y) : g.moveTo(x,y); pen = true; lt = p.t; }
  g.stroke();
}
function draw(t, songNow){
  const GUT = 52, pps = Wd < 600 ? 110 : 160, cx = GUT + (Wd-GUT)*0.42;
  const rowH = (Ht - 16)/(hi - lo), Y = m => Ht - 8 - (m - lo)*rowH, X = tt => cx + (tt - t)*pps;

  g.textBaseline = 'middle'; g.font = '700 11px Manrope, sans-serif';

    const black = [1,3,6,8,10].includes(pc(m)), y = Y(m);
    if (black){ g.fillStyle = 'rgba(255,255,255,0.025)'; g.fillRect(GUT, y-rowH/2, Wd-GUT, rowH); }
    g.fillStyle = pc(m) === 0 ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.035)'; g.fillRect(GUT, y+rowH/2, Wd-GUT, 1);
    let col = black ? 'rgba(138,146,166,0.55)' : C.muted;
    if (m === songPc){ col = C.song; } if (m === youPc){ col = songPc !== null && Math.abs(you - songNow) <= 0.5 ? C.ok : C.you; }
    if (m === songPc || m === youPc){ g.fillStyle = col; g.globalAlpha = 0.16; g.fillRect(0, y-rowH/2, GUT, rowH); g.globalAlpha = 1; }

  }

  const i0 = Math.max(0, Math.floor((t - (cx-GUT)/pps)/hop)), i1 = Math.min(frames.length, Math.ceil((t + (Wd-cx)/pps)/hop));
  const sp = []; for (let i = i0; i < i1; i++){ const v = frames[i]; sp.push({ t: i*hop, m: v === v ? v : null }); }

  line(trail, X, Y, C.you, 4);
  g.restore();
  // centre line + dots
  g.fillStyle = 'rgba(255,255,255,0.4)'; g.fillRect(cx-1, 0, 2, Ht);
  if (songNow !== null){ g.fillStyle = C.song; g.beginPath(); g.arc(cx, Y(songNow), 7, 0, 7); g.fill(); }
  if (you !== null){ const ok = songNow !== null && Math.abs(you - songNow) <= 0.5; g.fillStyle = ok ? C.ok : C.you; g.shadowColor = g.fillStyle; g.shadowBlur = 14; g.beginPath(); g.arc(cx, Y(you), 9, 0, 7); g.fill(); g.shadowBlur = 0; }
}

// ---------- loop ----------
function tick(){
  const t = now();
  const s = songAt(t); if (s !== null) lastSong = s;
  const u = readMic();
  // your line snaps to the song's octave, so any voice can follow any song
  if (u === null) you = null;
  else {
    if (lastSong !== null){
      const k = Math.round((lastSong - u)/12);
      if (octK === null || Math.abs(u + 12*octK - lastSong) > 8) octK = k; // only change octave when clearly needed
    }
    you = u + 12*(octK || 0);
  }
  if (playing){ trail.push({ t: t - LAT*rate, m: you }); if (trail.length > 30000) trail.splice(0, 10000); }
  // score: every moment the song has a voice, compare your pitch (full point within ±50 cents, half within ±100)
  if (playing && micOn){
    const ref = songAt(t - LAT*rate);
    if (ref !== null){ tot++; if (you !== null){ const d = Math.abs(you - ref); hitW += d <= 0.5 ? 1 : d <= 1 ? 0.5 : 0; } }
    $('live').textContent = pct() + '%';
  }
  // the scale grows to fit your voice, so low (or high) notes never fall off the screen
  if (you !== null){
    if (you < lo + 1.5) lo = Math.max(28, Math.floor(you) - 3);
    if (you > hi - 1.5) hi = Math.min(96, Math.ceil(you) + 3);
  }
  if (playing){ $('seek').value = t; }
  $('tNow').textContent = fmt(t);
  draw(t, s);
  requestAnimationFrame(tick);
}

// ---------- controls ----------
$('file').addEventListener('change', e => { load(e.target.files[0]); e.target.value = ''; });
$('pp').onclick = () => playing ? stop() : play();
$('mic').onclick = nextMic;
$('again').onclick = () => { audio.currentTime = 0; play(); };
$('seek').addEventListener('input', e => { const v = +e.target.value; audio.currentTime = v; trail = trail.filter(p => p.t < v); });
const SPEEDS = [1, 0.75, 0.5];
$('speed').onclick = () => { rate = SPEEDS[(SPEEDS.indexOf(rate) + 1) % SPEEDS.length]; audio.playbackRate = rate; $('speed').textContent = rate + '×'; };
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) load(f); });
document.addEventListener('keydown', e => { if (e.code === 'Space' && buf){ e.preventDefault(); playing ? stop() : play(); } });
requestAnimationFrame(tick);
})();
